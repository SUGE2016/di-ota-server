name: ota-server-prod

# 生产编排：自有服务从 GHCR 拉取；中间件仍用 Docker Hub 镜像（宿主机配置 registry-mirrors 加速）。
#
# 启动：
#   cp .env.prod.example .env && 编辑密钥
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# 国内拉取 GHCR（任选其一，写入 .env 的 OTA_IMAGE_REGISTRY）：
#   ghcr.dockerproxy.com/suge2016          # 推荐优先试
#   docker.1ms.run/ghcr.io/suge2016        # 备选
#   ghcr.io/suge2016                       # 海外/直连

services:
  ota-api:
    image: ${OTA_IMAGE_REGISTRY:-ghcr.io/suge2016}/di-ota-api:${OTA_IMAGE_TAG:-latest}
    container_name: ota-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NO_PROXY: minio,localhost,127.0.0.1,postgres,redis,rabbitmq,keycloak
      no_proxy: minio,localhost,127.0.0.1,postgres,redis,rabbitmq,keycloak
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ota-worker:
    image: ${OTA_IMAGE_REGISTRY:-ghcr.io/suge2016}/di-ota-worker:${OTA_IMAGE_TAG:-latest}
    container_name: ota-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NO_PROXY: minio,localhost,127.0.0.1,postgres,redis,rabbitmq
      no_proxy: minio,localhost,127.0.0.1,postgres,redis,rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ota-console:
    image: ${OTA_IMAGE_REGISTRY:-ghcr.io/suge2016}/di-ota-console:${OTA_IMAGE_TAG:-latest}
    container_name: ota-console
    restart: unless-stopped
    ports:
      - "${CONSOLE_PORT:-5173}:80"
    depends_on:
      - ota-api

  postgres:
    image: postgres:16
    container_name: ota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ota}
      POSTGRES_DB: ${POSTGRES_DB:-ota}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ota} -d ${POSTGRES_DB:-ota}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: ota-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ota-rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ota-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-18080}:8080"
    volumes:
      - ./deploy/keycloak/realm-ota-dev.json:/opt/keycloak/data/import/realm-ota-dev.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: ota-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    container_name: ota-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-ota-packages} &&
      mc anonymous set private local/${S3_BUCKET:-ota-packages} &&
      echo 'minio init done'
      "

volumes:
  postgres_data:
  minio_data:
